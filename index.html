<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Assinatura de Recebimento</title>
<style>
  :root { --ink:#1b1f23; --muted:#6b7280; --line:#e2e5e9; --paper:#f4f6f8; --ok:#2e7d32; --crit:#c62828; --brand:#1565c0; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--paper); color:var(--ink); }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:18px; margin-bottom:14px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th { text-align:left; font-size:.7rem; text-transform:uppercase; color:var(--muted); padding:6px 4px; border-bottom:1.5px solid var(--line); }
  td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.q { text-align:right; font-weight:700; white-space:nowrap; }
  label { display:block; font-size:.8rem; font-weight:700; margin:12px 0 4px; }
  input[type=text], input[type=tel] { width:100%; padding:12px; border:1.5px solid var(--line); border-radius:10px; font-size:1.2rem; letter-spacing:.3em; text-align:center; }
  input:focus { outline:none; border-color:var(--brand); }
  .pad-wrap { border:1.5px dashed #9aa3ad; border-radius:10px; background:#fff; position:relative; }
  canvas { width:100%; height:180px; display:block; touch-action:none; border-radius:10px; }
  .pad-wrap, canvas { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:none; }
  .pad-dica { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#b4bbc3; pointer-events:none; font-size:.9rem; }
  .linha { display:flex; justify-content:flex-end; margin-top:6px; }
  .link-btn { background:none; border:none; color:var(--brand); font-weight:700; cursor:pointer; padding:6px 0; font-size:.85rem; }
  .btn { width:100%; border:none; border-radius:12px; padding:15px; font-size:1rem; font-weight:800; color:#fff; background:var(--ok); cursor:pointer; margin-top:16px; }
  .btn:disabled { opacity:.6; }
  .msg { margin-top:12px; font-size:.88rem; min-height:1.2em; }
  .msg.erro { color:var(--crit); font-weight:700; }
  .termo { font-size:.8rem; color:var(--muted); line-height:1.45; margin-top:12px; }
  .estado { text-align:center; padding:28px 10px; }
  .estado.erro h1 { color:var(--crit); }
  .estado.ok h1 { color:var(--ok); }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="wrap" id="app"><div class="card estado">Carregando...</div></div>
<script>
  const CFG = window.ASSINATURA_CONFIG || {};
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num = v => Number(v || 0).toLocaleString('pt-BR');
  let desenhou = false, dados = null, ctx = null, cv = null;

  function estado(tipo, titulo, texto) {
    app.innerHTML = '<div class="card estado ' + tipo + '"><h1>' + esc(titulo) + '</h1><div class="sub">' + esc(texto || '') + '</div></div>';
  }

  // Os dados mostrados (peças, técnico) vêm no fragmento do link (#...). Servem só pra
  // o técnico conferir; quem decide se o link vale é o sistema, pelo token.
  try {
    const b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
    dados = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (!dados.t || !dados.c) throw 0;
  } catch (e) { dados = null; }


  function montar() {
    app.innerHTML =
      '<div class="card">' +
        '<h1>Termo de Entrega e Recebimento de Peças</h1>' +
        '<div class="sub">Requisição ' + esc(dados.c) + ' · ' + esc(dados.e) + ' · ' + esc(dados.d) + '<br>Técnico: <b>' + esc(dados.n) + '</b></div>' +
        '<table><thead><tr><th>Código</th><th>Produto</th><th style="text-align:right">Qtd.</th></tr></thead><tbody>' +
        (dados.p || []).map(p => '<tr><td>' + esc(p[0]) + '</td><td>' + esc(p[1] || '—') + '</td><td class="q">' + num(p[2]) + '</td></tr>').join('') +
        '</tbody></table>' +
        '<div class="termo">Ao assinar, declaro ter recebido as peças acima, em perfeitas condições e nas quantidades descritas.</div>' +
      '</div>' +
      '<div class="card">' +
        '<label>1. Assine no campo abaixo</label>' +
        '<div class="pad-wrap"><canvas id="pad"></canvas><div class="pad-dica" id="pad-dica">Assine aqui com o dedo</div></div>' +
        '<div class="linha"><button type="button" class="link-btn" onclick="limpar()">Limpar</button></div>' +
        '<label>2. PIN de 6 dígitos (informado pelo Almoxarifado)</label>' +
        '<input type="tel" id="pin" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="______">' +
        '<button type="button" class="btn" id="btn" onclick="enviar()">Confirmar recebimento</button>' +
        '<div class="msg" id="msg"></div>' +
      '</div>';
    try { iniciarPad(); } catch (e) { document.getElementById('msg').textContent = 'Erro ao iniciar o campo de assinatura: ' + e.message; document.getElementById('msg').className = 'msg erro'; }
  }

  function iniciarPad() {
    cv = document.getElementById('pad');
    const r = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.fillStyle = '#111';
    let desenhando = false, ult = null;
    const pos = p => { const b = cv.getBoundingClientRect(); return { x: p.clientX - b.left, y: p.clientY - b.top }; };
    const inicio = p => { desenhando = true; ult = pos(p); ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.2, 0, 6.3); ctx.fill(); };
    const mover = p => {
      if (!desenhando) return;
      const q = pos(p);
      ctx.beginPath(); ctx.moveTo(ult.x, ult.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      ult = q; desenhou = true;
      document.getElementById('pad-dica').style.display = 'none';
    };
    const fim = () => { desenhando = false; };
    // toque (celular/tablet): preventDefault impede a rolagem e o toque longo de roubarem o gesto
    cv.addEventListener('touchstart', e => { e.preventDefault(); inicio(e.touches[0]); }, { passive: false });
    cv.addEventListener('touchmove', e => { e.preventDefault(); mover(e.touches[0]); }, { passive: false });
    cv.addEventListener('touchend', e => { e.preventDefault(); fim(); }, { passive: false });
    cv.addEventListener('touchcancel', fim);
    // mouse (computador)
    cv.addEventListener('mousedown', e => inicio(e));
    window.addEventListener('mousemove', e => mover(e));
    window.addEventListener('mouseup', fim);
  }

  function limpar() {
    const b = cv.getBoundingClientRect(); ctx.clearRect(0, 0, b.width, b.height);
    desenhou = false; document.getElementById('pad-dica').style.display = '';
  }

  // Reduz a imagem (360x140) pra caber folgado no limite de tamanho do issue do GitHub.
  function assinaturaPequena() {
    const o = document.createElement('canvas'); o.width = 360; o.height = 140;
    o.getContext('2d').drawImage(cv, 0, 0, o.width, o.height);
    return o.toDataURL('image/png');
  }

  // Cifra o conteúdo (AES-256-GCM; a chave AES vai cifrada em RSA-OAEP com a chave PÚBLICA).
  // O token da página consegue LER issues; cifrado, ninguém além do servidor lê token/PIN/assinatura.
  const b64 = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
  async function cifrar(texto) {
    const pub = await crypto.subtle.importKey('spki', Uint8Array.from(atob(CFG.chavePublica), c => c.charCodeAt(0)),
                                              { name: 'RSA-OAEP', hash: 'SHA-256' }, false, ['encrypt']);
    const aes = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, aes, new TextEncoder().encode(texto));
    const k = await crypto.subtle.encrypt({ name: 'RSA-OAEP' }, pub, await crypto.subtle.exportKey('raw', aes));
    return JSON.stringify({ k: b64(k), iv: b64(iv), c: b64(c) });
  }

  function enviar() {
    const msg = document.getElementById('msg'), btn = document.getElementById('btn');
    const pin = document.getElementById('pin').value.trim();
    msg.className = 'msg';
    if (!desenhou) { msg.textContent = 'Desenhe a sua assinatura no campo.'; msg.className = 'msg erro'; return; }
    if (!/^\d{6}$/.test(pin)) { msg.textContent = 'Digite o PIN de 6 dígitos.'; msg.className = 'msg erro'; return; }
    const claro = JSON.stringify({ t: dados.t, pin: pin, a: assinaturaPequena() });
    if (claro.length > 40000) { msg.textContent = 'Assinatura complexa demais. Limpe e assine de forma mais simples.'; msg.className = 'msg erro'; return; }
    btn.disabled = true; msg.textContent = 'Enviando...';
    cifrar(claro).then(corpo => fetch('https://api.github.com/repos/' + CFG.repo + '/issues', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + dados.k, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: 'ASSINATURA', body: corpo }),
    })).then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      estado('ok', 'Assinatura enviada', 'O Almoxarifado receberá a confirmação em instantes. Pode fechar esta página.');
    }).catch(e => { btn.disabled = false; msg.textContent = 'Não foi possível enviar (' + (e && e.message ? e.message : 'erro') + '). Tente de novo.'; msg.className = 'msg erro'; });
  }

  // Partida: por último, depois de TODAS as declarações acima.
  if (!dados) estado('erro', 'Link inválido', 'Peça um novo link ao Almoxarifado.');
  else if (!CFG.repo || !dados.k || !CFG.chavePublica) estado('erro', 'Página não configurada', 'Avise o Almoxarifado.');
  else montar();
</script>
</body>
</html>
